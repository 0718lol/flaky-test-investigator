<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="theme-color" content="#0b0f0e">
  <title>岔路人生 | 人生推演工作台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="rail" aria-label="主导航">
      <button class="brand" type="button" data-nav="people" aria-label="返回人物空间">
        <span class="brand-mark">↗</span>
        <span><strong>岔路人生</strong><small>FORKED LIFE</small></span>
      </button>

      <div class="model-status loading" id="modelStatus" role="status" aria-live="polite">
        <i aria-hidden="true"></i><span>正在检测模型</span>
      </div>

      <nav class="nav-list">
        <button class="nav-item active" type="button" data-nav="people"><span aria-hidden="true">▦</span>人物空间</button>
        <button class="nav-item" type="button" data-nav="profile"><span aria-hidden="true">◉</span>人物档案</button>
        <button class="nav-item" type="button" data-nav="simulate"><span aria-hidden="true">↗</span>时间推演</button>
        <button class="nav-item" type="button" data-nav="compare"><span aria-hidden="true">⇄</span>版本对照</button>
      </nav>

      <div class="rail-person" id="railPerson"></div>

      <div class="rail-foot">
        <div class="local-state"><i></i>本地保存</div>
        <p>人物资料与推演记录保存在当前设备。</p>
        <button class="text-action" type="button" data-action="export">导出备份</button>
        <button class="text-action" type="button" data-action="import">导入备份</button>
      </div>
    </aside>

    <main class="main-content" id="mainContent" tabindex="-1"></main>
  </div>

  <div class="modal-wrap" id="modal" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-head">
        <div><div class="eyebrow" id="modalKicker">EDIT</div><h2 id="modalTitle">编辑</h2></div>
        <button class="icon-button" id="closeModal" type="button" aria-label="关闭">×</button>
      </header>
      <div class="modal-body" id="modalBody"></div>
      <footer class="modal-foot">
        <button class="button" id="cancelModal" type="button">取消</button>
        <button class="button primary" id="confirmModal" type="button">确认</button>
      </footer>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
  <script src="app.js?v=20260827-4" defer></script>
</body>
</html>
